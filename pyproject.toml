[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bidirectional-modeling"
version = "0.1.0"
description = "A verifiable macro-purpose ↔ micro-structure modeling reference framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Codex"}]
dependencies = []

[project.scripts]
bidirectional-modeling = "bidirectional_modeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

