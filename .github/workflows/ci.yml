name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
      - name: Install package and test tools
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests with coverage
        run: |
          coverage run --source=bidirectional_modeling -m unittest discover -s tests -v
          coverage report --show-missing --fail-under=85
      - name: Run JSON demo
        run: |
          bidirectional-modeling demo --json > demo.json
          python -m json.tool demo.json > /dev/null

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "bidirectional_modeling/__init__.py",
              "bidirectional_modeling/correspondence.py",
              "bidirectional_modeling/core.py",
              "bidirectional_modeling/cli.py",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing package files: {sorted(missing)}")
          PY
      - name: Install built wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl
          python -c "import bidirectional_modeling; assert bidirectional_modeling.__version__ == '0.5.0'"
          bidirectional-modeling demo --json > /dev/null
