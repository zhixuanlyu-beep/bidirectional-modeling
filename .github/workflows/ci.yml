name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
      - name: Install package and test tools
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage json -o coverage.json
          python tools/check_coverage.py coverage.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Check concept distinguishing experiments
        run: python tools/check_concept_mutations.py
      - name: Check bounded-work regressions
        run: |
          python benchmarks/review_costs.py > review-costs.json
          python benchmarks/evidence_update_costs.py > evidence-update-costs.json
      - name: Run JSON demo
        run: |
          bidirectional-modeling demo --json > demo.json
          python -m json.tool demo.json > /dev/null
          bidirectional-modeling search-demo --json > search-demo.json
          python -m json.tool search-demo.json > /dev/null
          bidirectional-modeling context-demo --json > context-demo.json
          python -m json.tool context-demo.json > /dev/null

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "bidirectional_modeling/__init__.py",
              "bidirectional_modeling/correspondence.py",
              "bidirectional_modeling/core.py",
              "bidirectional_modeling/cli.py",
              "bidirectional_modeling/composition.py",
              "bidirectional_modeling/provenance.py",
              "bidirectional_modeling/residual.py",
              "bidirectional_modeling/structural.py",
              "bidirectional_modeling/search.py",
              "bidirectional_modeling/search_examples.py",
              "bidirectional_modeling/search_adapter.py",
              "bidirectional_modeling/search_session.py",
              "bidirectional_modeling/search_benchmark.py",
              "bidirectional_modeling/search_index.py",
              "bidirectional_modeling/search_reconstruction.py",
              "bidirectional_modeling/search_queries.py",
              "bidirectional_modeling/search_lazy.py",
              "bidirectional_modeling/search_repairs.py",
              "bidirectional_modeling/search_explanations.py",
              "bidirectional_modeling/search_partial.py",
              "bidirectional_modeling/context_network.py",
              "bidirectional_modeling/certificate_transport.py",
              "bidirectional_modeling/macro_certificates.py",
              "bidirectional_modeling/context_examples.py",
              "bidirectional_modeling/_exploration.py",
              "bidirectional_modeling/_generation.py",
              "bidirectional_modeling/extensions/__init__.py",
              "bidirectional_modeling/extensions/boolean.py",
              "bidirectional_modeling/extensions/gluing.py",
              "bidirectional_modeling/extensions/concepts.py",
              "bidirectional_modeling/extensions/implications.py",
          }
          missing = required - names
          if missing:
              raise SystemExit(f"wheel is missing package files: {sorted(missing)}")
          PY
      - name: Install built wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl
          python -c "import bidirectional_modeling; assert bidirectional_modeling.__version__ == '0.33.0'"
          bidirectional-modeling demo --json > /dev/null
          bidirectional-modeling search-demo --json > /dev/null
          bidirectional-modeling context-demo --json > /dev/null
          bidirectional-modeling search-benchmark --json > /dev/null
          bidirectional-modeling search-updates-benchmark --json > /dev/null
          python - <<'PYCODE'
          from bidirectional_modeling import ConstraintQuery, QueryStatus
          from bidirectional_modeling.search_queries import verify_query_result
          from bidirectional_modeling.search_examples import conflict_search_scenario
          problem, evidence = conflict_search_scenario()
          query = ConstraintQuery(evidence=evidence)
          receipt = problem.query(query)
          assert receipt.status is QueryStatus.FOUND
          assert verify_query_result(problem, query, receipt).status == 'valid'
          PYCODE
